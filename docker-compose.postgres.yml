services:
  postgres:
    image: postgres:16-alpine
    container_name: champion-fit-postgres-test
    environment:
      POSTGRES_DB: champion_fit
      POSTGRES_USER: champion_fit
      POSTGRES_PASSWORD: champion_fit_local
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U champion_fit -d champion_fit"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - champion_fit_pgdata:/var/lib/postgresql/data

volumes:
  champion_fit_pgdata:
