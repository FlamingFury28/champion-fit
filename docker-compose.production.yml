x-app-image: &app-image
  image: champion-fit:local
  build:
    context: .

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: champion_fit
      POSTGRES_USER: champion_fit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting}
    volumes:
      - champion_fit_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U champion_fit -d champion_fit"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app-image
    profiles: ["bootstrap"]
    command: python migrate_postgres.py --sqlite /data/champion_fit.db postgresql://champion_fit@postgres:5432/champion_fit
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting}
    volumes:
      - type: bind
        source: ${CHAMPION_FIT_SQLITE_PATH:-./champion_fit.db}
        target: /data/champion_fit.db
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "on-failure:5"

  web:
    <<: *app-image
    environment:
      CHAMPION_FIT_DATABASE_URL: postgresql://champion_fit@postgres:5432/champion_fit
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting}
    ports:
      - "${CHAMPION_FIT_BIND_ADDRESS:-127.0.0.1}:8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  champion_fit_pgdata:
