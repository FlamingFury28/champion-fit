services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: champion_fit
      POSTGRES_USER: champion_fit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting}
    volumes:
      - champion_fit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U champion_fit -d champion_fit"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: sh -c 'python migrate_postgres.py "postgresql://champion_fit:$${POSTGRES_PASSWORD}@postgres:5432/champion_fit"'
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: .
    environment:
      CHAMPION_FIT_DATABASE_URL: postgresql://champion_fit:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting}@postgres:5432/champion_fit
    ports:
      - "8787:8787"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  champion_fit_pgdata:
