name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run Python tests
        run: python -m pytest -q

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Build production container
        run: docker build --tag champion-fit:ci .

      - name: Smoke-test production container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name champion-fit-smoke \
            --health-interval=1s --health-start-period=1s --health-timeout=2s --health-retries=10 \
            champion-fit:ci
          trap 'docker logs champion-fit-smoke || true; docker rm --force champion-fit-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' champion-fit-smoke)"
            if [ "$status" = healthy ]; then
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              exit 1
            fi
            sleep 1
          done
          exit 1

      - name: Upload test artifacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
